<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C111B">
<meta name="description" content="Practice Claude Certified Architect, Foundations with scenario questions, flashcards, visual lessons, a timed mock exam, and Archie, your study guide.">
<title>CCAR-F Study Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Saira:wght@300..700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#ECEFF3; --panel:#FFFFFF; --panel2:#E2E7EE; --ink:#0F131A; --ink-on:#FFFFFF; --muted:#566074; --line:#CBD3DF; --hl:#F2B24C;
  --d1:#2B58E6; --d2:#0A9585; --d3:#C97F0A; --d4:#8450DC; --d5:#C23B8B;
  --good:#10795A; --bad:#CC2B3D; --warn:#B26E00;
  --serif:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1017; --panel:#141A25; --panel2:#1D2635; --ink:#EAF0F8; --ink-on:#0C1017; --muted:#8F9DB4; --line:#2A3548; --hl:#8A5200;
    --d1:#7497FF; --d2:#3DD3BF; --d3:#F2B24C; --d4:#B88EFF; --d5:#F57DBD;
    --good:#4DD6A2; --bad:#FF7C88; --warn:#F2B24C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1017; --panel:#141A25; --panel2:#1D2635; --ink:#EAF0F8; --ink-on:#0C1017; --muted:#8F9DB4; --line:#2A3548; --hl:#8A5200;
  --d1:#7497FF; --d2:#3DD3BF; --d3:#F2B24C; --d4:#B88EFF; --d5:#F57DBD;
  --good:#4DD6A2; --bad:#FF7C88; --warn:#F2B24C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.58 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
code{font-family:var(--mono);font-size:.84em;background:var(--panel2);border-radius:4px;padding:.08em .38em;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:.86rem}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:26px 20px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--line)}
.mark{display:flex;gap:3px;height:9px;margin-bottom:12px}
.mark i{display:block;border-radius:2px;background:var(--c)}
.brand b{display:block;font-family:var(--serif);font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.brand span{display:block;margin-top:6px;color:var(--muted);font-size:.84rem;line-height:1.35}
.rnav{display:flex;flex-direction:column;gap:2px}
.rnav button,.tabbar button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:10px 12px;text-align:left;font-weight:500;color:var(--muted)}
.rnav button:hover{background:var(--panel2);color:var(--ink)}
.rnav button[aria-current="true"]{background:var(--ink);color:var(--ink-on)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rfoot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:.86rem;color:var(--muted)}
.rfoot b{color:var(--ink);font-family:var(--serif);font-size:1.5rem;display:block;line-height:1}
.main{container-type:inline-size;padding:34px clamp(16px,4vw,52px) 96px;min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1040px;width:100%}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line);gap:14px}
  .rail .rnav,.rail .rfoot{display:none}
  .brand span{display:none}
  .brand b{font-size:1.5rem}
  .mark{margin-bottom:6px;width:90px}
  .main{padding-top:22px;padding-bottom:104px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.72rem;justify-content:center;align-items:center;text-align:center}
  .tabbar button[aria-current="true"]{color:var(--ink);font-weight:600}
  .tabbar button[aria-current="true"] .ico{stroke-width:2.4}
}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead h1{font-size:clamp(2rem,4.4cqi,2.9rem)}
.pagehead p{max-width:60ch;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.panel.hero{border-radius:24px;padding:clamp(18px,3cqi,32px)}
.panel.tight{padding:16px}
.panel h2{font-size:1.5rem} .panel h3{font-size:1.2rem}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.split{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@container (min-width:720px){.cols.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 16px;font-weight:600;min-height:42px;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);min-height:34px;padding:4px 10px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--d1);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:.9rem;font-weight:500}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.fieldlbl{font-size:.82rem;font-weight:600;margin-bottom:7px;color:var(--muted)}
select,input[type=date]{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;max-width:100%;width:100%}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;border-radius:5px;padding:2px 9px;background:var(--panel2);color:var(--ink)}
.tag i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink));display:inline-block}
.tag.alt{background:none;border:1.5px solid var(--warn);color:var(--warn)}
/* trace */
.trace{--lab:150px}
.traceTop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.traceTop h2{font-size:clamp(1.5rem,3.2cqi,2.1rem);max-width:16ch}
.bignum{font-family:var(--serif);font-weight:800;font-size:clamp(3.4rem,10cqi,6rem);letter-spacing:-.05em;line-height:.85;text-align:right}
.bignum small{display:block;font-family:var(--sans);font-weight:500;font-size:.8rem;letter-spacing:0;color:var(--muted);margin-top:8px}
.axis{position:relative;height:18px;margin-left:var(--lab);margin-right:52px;font-size:.72rem;color:var(--muted)}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.trow{display:grid;grid-template-columns:var(--lab) minmax(0,1fr) 52px;align-items:center;width:100%;background:none;border:0;padding:7px 0;text-align:left;border-radius:6px;position:relative}
button.trow:hover{background:var(--panel2)}
.trow .nm{display:flex;gap:8px;align-items:baseline;padding-right:10px;min-width:0}
.trow .nm b{font-family:var(--serif);font-size:1rem}
.trow .nm span{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{position:relative;height:26px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 25%)}
.span{position:absolute;top:2px;bottom:2px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,var(--panel));border:1.5px solid var(--c);overflow:hidden;transform-origin:left}
.span .f{position:absolute;inset:0 auto 0 0;background:var(--c);transform-origin:left}
.trow .pc{font-family:var(--mono);font-size:.82rem;text-align:right}
.intro .span{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms)}
.intro .span .f{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 350ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:620px){
  .trace{--lab:0px}
  .trow{grid-template-columns:minmax(0,1fr) 44px}
  .trow .nm{grid-column:1/-1;padding-bottom:4px}
  .axis{margin-right:44px}
  .axis .end{display:none}
}
/* call block */
.call{background:var(--ink);color:var(--ink-on);border-radius:10px;padding:16px 18px;font-family:var(--mono);font-size:.84rem;line-height:1.75;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.call .k{opacity:.62}.call .v{font-weight:500}
.call .hl{color:var(--hl);font-weight:500}
/* heat map */
.heat{display:flex;flex-direction:column;gap:7px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .dl{width:30px;font-family:var(--serif);font-weight:700;color:var(--c)}
.hcells{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:42px;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:.74rem;padding:0;display:grid;place-items:center;color:var(--muted)}
.cell:hover{border-color:var(--ink);color:var(--ink)}
.cell.s0{background:var(--panel2)}
.cell.lo{background:color-mix(in srgb,var(--bad) 24%,var(--panel));border-color:var(--bad);color:var(--ink)}
.cell.mid{background:color-mix(in srgb,var(--warn) 24%,var(--panel));border-color:var(--warn);color:var(--ink)}
.cell.hi{background:color-mix(in srgb,var(--good) 26%,var(--panel));border-color:var(--good);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line)}
.streak{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.streak i{width:11px;height:11px;border-radius:2px;background:var(--panel2)}
.streak i.on{background:var(--good)}
.streak i.today{outline:1.5px solid var(--ink);outline-offset:1px}
/* progress rail */
.prail{display:flex;gap:4px}
.prail i{flex:1;height:7px;border-radius:2px;background:var(--panel2)}
.prail i.ok{background:var(--good)}.prail i.no{background:var(--bad)}.prail i.cur{background:var(--ink)}
/* question */
.qgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@container (min-width:780px){.qgrid{grid-template-columns:290px minmax(0,1fr)}.scn{position:sticky;top:20px}}
.scn{border-left:5px solid var(--c);background:var(--panel);border-radius:4px 12px 12px 4px;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.scn summary{list-style:none;cursor:pointer;display:block;font-weight:700;font-family:var(--serif);font-size:1.02rem}
.scn summary::-webkit-details-marker{display:none}
.scn p{margin-top:8px;font-size:.88rem;color:var(--muted)}
.qtext{font-size:1.14rem;line-height:1.5;overflow-wrap:anywhere;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;align-items:start;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .k{font-family:var(--mono);font-size:.82rem;width:28px;height:28px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-weight:500}
.opt .tx{overflow-wrap:anywhere;padding-top:3px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--panel2)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--ink-on)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--panel));animation:pop .4s ease}
.opt.right .k{background:var(--good);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel));animation:shake .35s ease}
.opt.wrong .k{background:var(--bad);color:var(--panel)}
.opt .st{display:block;font-size:.8rem;font-weight:600;margin-top:4px}
.opt.right .st{color:var(--good)}.opt.wrong .st{color:var(--bad)}
.opt[disabled]{cursor:default}
@keyframes pop{0%{transform:scale(.985)}55%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.explain{border-radius:10px;padding:16px 18px;background:var(--panel2);border-left:5px solid var(--c);animation:rise .3s ease}
.explain.ok{--c:var(--good)}.explain.no{--c:var(--bad)}
.explain .vd{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin-bottom:6px;color:var(--c)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rulebox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.rulebox b{color:var(--ink)}
/* mock */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:center}
.timer{font-family:var(--mono);font-size:1.5rem;font-weight:500;letter-spacing:-.02em}
.timer.low{color:var(--bad)}
.pace{font-size:.86rem;font-weight:600}
.pace.late{color:var(--bad)}.pace.ok{color:var(--good)}
@media (max-width:620px){.mockbar{grid-template-columns:auto minmax(0,1fr)}.mockbar .mr{grid-column:1/-1}}
.qmapg{display:flex;flex-direction:column;gap:12px}
.qmapg .gl{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.qmap{display:flex;flex-wrap:wrap;gap:6px}
.qmap button{width:36px;height:36px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:.78rem;padding:0}
.qmap button.ans{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.qmap button.flag{box-shadow:inset 0 -5px 0 var(--warn)}
.qmap button.cur{outline:2px solid var(--d1);outline-offset:2px}
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.score .big{font-family:var(--serif);font-weight:800;font-size:clamp(3.2rem,12cqi,5.5rem);letter-spacing:-.05em;line-height:.85}
.pass{color:var(--good)}.fail{color:var(--bad)}
.verdictbar{border-radius:10px;padding:12px 16px;font-weight:700;font-family:var(--serif);font-size:1.15rem;background:color-mix(in srgb,var(--c) 14%,var(--panel));border-left:5px solid var(--c)}
.todo{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .id{font-family:var(--mono);font-size:.84rem;font-weight:500}
/* flashcards */
.deckbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.deckbar i{display:block;background:var(--c)}
.flipwrap{perspective:1400px}
.flipper{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer;width:100%;background:none;border:0;padding:0;text-align:left}
.flipper.back{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:300px;border-radius:18px;padding:clamp(20px,4cqi,36px);display:flex;flex-direction:column;justify-content:center;gap:14px;border:1.5px solid var(--line);background:var(--panel)}
.face.fr{border-top:8px solid var(--c)}
.face.bk{transform:rotateY(180deg);background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.face .q{font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem,4cqi,2.3rem);line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.face .a{font-size:1.1rem;line-height:1.6;overflow-wrap:anywhere}
.face .hint{font-size:.82rem;opacity:.65}
.face.bk code{background:rgba(127,127,127,.28);color:inherit}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}.opt.right,.opt.wrong,.explain{animation:none}.intro .span,.intro .span .f{animation:none}}
/* library */
.subtabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
details.rule{border-top:1px solid var(--line)}
details.rule:first-of-type{border-top:0}
details.rule summary{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:10px;align-items:baseline;padding:14px 0;cursor:pointer;list-style:none}
details.rule summary::-webkit-details-marker{display:none}
details.rule summary::after{content:'+';font-family:var(--mono);color:var(--muted);justify-self:end}
details.rule[open] summary::after{content:'\2212'}
.rn{font-family:var(--serif);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.04em;color:var(--c,var(--ink))}
.rt{font-weight:700;font-size:1.05rem}
.rtell{display:block;font-weight:400;color:var(--muted);font-size:.9rem;margin-top:2px}
.rbody{display:grid;gap:12px;padding:0 0 18px 58px}
@media (max-width:620px){.rbody{padding-left:0}}
.rbody b{display:block;font-size:.82rem;color:var(--muted);margin-bottom:2px}
.shape{border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.shape b{font-family:var(--serif);font-size:1.1rem}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
th{font-size:.82rem;color:var(--muted);font-weight:600}
.tsrow{display:grid;grid-template-columns:42px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.tsrow .id{font-family:var(--mono);font-weight:500;color:var(--c);font-size:.88rem}
.tsrow .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rate{display:flex;gap:4px;flex-wrap:wrap}
.rate button{border:1.5px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 10px;font-size:.8rem;font-weight:500}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.check{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink);margin:2px 0 0}
.weekhd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.now{font-size:.78rem;font-weight:700;background:var(--ink);color:var(--ink-on);border-radius:4px;padding:1px 8px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.quote{border-left:5px solid var(--d3);padding:6px 0 6px 16px;font-size:1.08rem;line-height:1.5}

/* guidebook */
.chapnum{font-family:var(--serif);font-weight:800;font-size:clamp(3.4rem,11cqi,6.5rem);letter-spacing:-.05em;line-height:.85;color:var(--c)}
.chap{display:flex;flex-direction:column;gap:14px}
.chap h2{font-size:clamp(1.5rem,3.4cqi,2.2rem)}
.xp{display:flex;flex-direction:column;gap:8px;max-width:620px}
.xpbar{height:14px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,var(--panel2));overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--c);border-radius:7px}
.moves{counter-reset:m;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.moves li{counter-increment:m;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.moves li::before{content:counter(m);font-family:var(--serif);font-weight:800;font-size:1.5rem;line-height:1.1;color:var(--c)}
.callout{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel));border-radius:4px 12px 12px 4px;padding:14px 16px;min-width:0}
.callout b{display:block;font-family:var(--serif);font-size:1.08rem;color:var(--c);margin-bottom:4px}
.callout p,.callout li{font-size:.92rem}
.callout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.callout.tip{--c:var(--d2)}.callout.warn{--c:var(--bad)}.callout.secret{--c:var(--d4)}
.seg button.cl::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:8px;vertical-align:1px}
.boss{border-top:6px solid var(--c)}
.boss .lbl,.beast .lbl{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.hp{position:relative;height:14px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--bad)}
.hp::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 12px,var(--panel) 12px 14px)}
.beast{display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:620px){.beast{grid-template-columns:minmax(0,1fr)}}
.glyphbox{width:76px;height:76px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--panel));border:1.5px solid var(--c)}
.tells{margin:2px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.seen{font-size:.88rem;margin:4px 0 0;padding:8px 12px;border-radius:8px;background:var(--panel2);overflow-wrap:anywhere}
.itemgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.item{border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px;background:var(--panel);min-width:0}
.iname{font-family:var(--mono);font-size:.92rem;overflow-wrap:anywhere}
.dgsvg{width:100%;max-width:470px;height:auto;display:block}
.dg{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.dg.hot{fill:color-mix(in srgb,var(--d1) 16%,var(--panel));stroke:var(--d1)}
.dg.bad{fill:color-mix(in srgb,var(--bad) 12%,var(--panel));stroke:var(--bad)}
.dt{font:600 13px var(--sans);fill:var(--ink)}
.dt.dm{font-weight:400;font-size:12px;fill:var(--muted)}
.sm{font:600 13px var(--mono);fill:var(--ink)}
.sl{font:500 12px var(--mono);fill:var(--muted)}
.da{fill:none;stroke:var(--ink);stroke-width:1.5}
.dd{stroke-dasharray:5 4}
.dgnote b{display:block;font-size:.82rem;color:var(--muted);margin-bottom:2px}
.dgnote p{font-size:.95rem}
/* trigger words */
.trig{border-left:6px solid var(--c);display:flex;flex-direction:column;gap:10px}
.trig .tw{font-family:var(--serif);font-size:1.12rem}
.trig .lbl,.krule .lbl{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.trig p{font-size:.95rem}
.trig .tn{padding:10px 12px;border-radius:8px;background:var(--panel2);font-size:.9rem}
.vtag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:5px;padding:1px 9px;background:color-mix(in srgb,var(--c) 10%,var(--panel));white-space:nowrap}
.krule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.krule p{grid-column:1/-1}
.reslink{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
/* palette */
#pal[hidden]{display:none}
#pal{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.55);display:grid;grid-template-rows:auto;place-items:start center;padding:12vh 16px 0}
.palbox{width:100%;max-width:560px;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:16px 18px;font:inherit;font-size:1.05rem;background:var(--panel);color:var(--ink);outline:0;min-height:0}
.palbox ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.palbox li{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.95rem}
.palbox li[aria-selected="true"]{background:var(--ink);color:var(--ink-on)}
.palbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);font-size:.86rem}
.palbtn:hover{border-color:var(--ink);color:var(--ink)}
.mpal{display:none;margin-left:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem}
@media (max-width:860px){.mpal{display:block}.tabbar{grid-template-columns:repeat(6,1fr)!important}.tabbar button{font-size:.66rem!important}}




/* ===== PS2-era war table ===== */
:root,:root:not([data-theme="light"]),:root[data-theme]{
  --bg:#0C111B; --panel:#151D2B; --panel2:#1E293B; --ink:#E6EAF2; --ink-on:#0C111B; --muted:#9AA5BA; --line:#2E3A51; --hl:#E9C46A;
  --gold:#C9A55A; --goldhi:#F2D894; --goldlo:#7A5E26; --p1:#4A92FF; --foe:#DB5A50; --cont:#E2A440; --fog:#6B7586;
  --d1:#E0675A; --d2:#45B5C6; --d3:#E2A440; --d4:#A08AE6; --d5:#63BF6F;
  --good:#5CC97A; --bad:#E0605A; --warn:#E2A440;

  --sans:'Saira','Segoe UI',system-ui,-apple-system,sans-serif;

path d='M1265 260L1320 150L1320 260Z' fill='%23121B2B'/><path d='M1320 150L1430 147L1375 260Z' fill='%23121B2B'/><path d='M1320 260L1320 150L1375 260Z' fill='%23151F31'/><path d='M1375 260L1430 147L1430 260Z' fill='%230D1420'/><path d='M1430 147L1540 191L1485 260Z' fill='%230F1724'/><path d='M1430 260L1430 147L1485 260Z' fill='%230D1420'/><path d='M1485 260L1540 191L1540 260Z' fill='%230D1420'/><path d='M1540 191L1650 175L1595 260Z' fill='%23151F31'/><path d='M1540 260L1540 191L1595 260Z' fill='%230F1724'/><path d='M1595 260L1650 175L1650 260Z' fill='%230F1724'/></g></svg>") bottom/100% 100% no-repeat}
.app{position:relative;z-index:1}
::selection{background:var(--gold);color:#140E02}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:.01em;line-height:1.2}
code{font-family:var(--mono);font-size:.9em;background:rgba(255,255,255,.07);color:#CFE4FF;border-radius:4px;padding:.05em .35em}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--goldhi);outline-offset:3px}
.gold{background:linear-gradient(180deg,#FFF3CF 0%,#E3C27A 48%,#B08A3E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* rail */
.rail{background:linear-gradient(180deg,#131B29,#0B1019);border-right:1px solid #05080D;box-shadow:inset -1px 0 0 rgba(201,165,90,.22)}
.mark{gap:4px;height:6px}.mark i{border-radius:3px;box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.brand b{font-family:var(--serif);font-weight:400;font-size:2.1rem;letter-spacing:.02em;background:linear-gradient(180deg,#FFF3CF 0%,#E3C27A 50%,#A5823A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.brand span{color:var(--muted)}
.rnav{gap:3px}
.rnav button{border-radius:6px;color:var(--muted);font-weight:500;padding:9px 12px;position:relative}
.rnav button:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.rnav button[aria-current="true"]{background:linear-gradient(90deg,rgba(201,165,90,.26),rgba(201,165,90,.03));color:var(--goldhi);box-shadow:inset 3px 0 0 var(--gold)}
.rnav .coachbtn,.tabbar .coachbtn{color:#BFE9FF}
.rnav .coachbtn .spr,.tabbar .coachbtn .spr{width:26px;height:26px;margin:-3px 0}
.rnav .coachbtn{margin-top:8px;border:1px solid rgba(111,231,255,.22);background:rgba(69,181,198,.07)}
.rnav .coachbtn:hover{background:rgba(69,181,198,.16);color:#fff}
.palbtn{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.palbtn:hover{border-color:var(--gold);color:var(--ink)}
.rfoot b{font-family:var(--serif);font-weight:400;color:var(--goldhi)}
.kbd{border-color:var(--line);color:var(--muted);background:rgba(0,0,0,.25)}
.mpal{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px}
.tabbar{background:linear-gradient(180deg,#141C2A,#0B1019);border-top:1px solid rgba(201,165,90,.35);grid-template-columns:repeat(5,1fr)!important}
.tabbar button{font-size:.76rem!important}
.tabbar button{color:var(--muted)}
.tabbar button[aria-current="true"]{color:var(--goldhi)}
/* resource bar */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;border-radius:8px;background:linear-gradient(180deg,#1C2638,#111826);box-shadow:var(--trim),0 6px 18px -10px rgba(0,0,0,.8)}
.hud .res{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:5px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);font-size:.86rem;color:var(--muted)}
.hud .res b{font-family:var(--mono);font-weight:400;font-size:1.02rem;color:var(--ink)}
.hud .res svg{width:18px;height:18px;flex:none}
.hud .res.hero b{color:var(--goldhi)}
.hud .sp{margin-left:auto}
@container (max-width:620px){.hud{gap:6px}.hud .res{padding:3px 8px;font-size:.8rem}.hud .sp{margin-left:0}}
/* page heads */
.pagehead h1{font-size:clamp(2rem,5.2cqi,3.1rem);background:linear-gradient(180deg,#FFF6DA 0%,#E6C77F 50%,#AD893F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.65));padding-bottom:.05em}
.pagehead p{color:var(--muted);max-width:62ch}
/* panels */
.panel{background:linear-gradient(180deg,#1A2334 0%,#121926 100%);border:1px solid #05080D;border-radius:8px;box-shadow:var(--trim),0 14px 30px -14px rgba(0,0,0,.75)}
.panel.hero{background:linear-gradient(180deg,#1E2940 0%,#131B29 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(201,165,90,.45),0 18px 36px -16px rgba(0,0,0,.8)}
.panel h2{font-size:1.5rem;color:#EED9A0}.panel h3{font-size:1.18rem;color:#EED9A0}
/* buttons */
.btn{border:1px solid #05080D;border-radius:6px;color:var(--ink);font-weight:600;
  background:linear-gradient(180deg,#3B4B69 0%,#28354F 48%,#1C263A 52%,#232F47 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(201,165,90,.22),0 2px 5px rgba(0,0,0,.5);transition:filter .15s,box-shadow .15s}
.btn:hover{border-color:#05080D;filter:brightness(1.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(242,216,148,.55),0 2px 8px rgba(0,0,0,.5)}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn.primary{color:#221704;text-shadow:0 1px 0 rgba(255,255,255,.35);background:linear-gradient(180deg,#F8E3A4 0%,#DFB75E 48%,#C29639 52%,#D6AB50 100%);border-color:#4A3510}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--goldhi);box-shadow:none}
.seg button{border:1px solid #05080D;border-radius:5px;background:linear-gradient(180deg,#2C3A55,#1C263A);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg button:hover{filter:brightness(1.15);border-color:#05080D}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#F3DC9A,#C99E45);color:#221704;border-color:#4A3510}
.subtabs{border-bottom:1px solid rgba(201,165,90,.35)}
.subtabs button{font-family:var(--serif);font-size:1.02rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-current="true"]{color:var(--goldhi);border-bottom-color:var(--gold);text-shadow:0 0 12px rgba(242,216,148,.35)}
select,input[type=date]{background:#0E1420;border:1px solid var(--line);border-radius:6px;color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.fieldlbl{color:var(--muted)}
.tag{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.tag i{border-radius:50%;box-shadow:0 0 6px var(--c)}
.tag.alt{border-color:var(--warn);color:var(--warn);background:none}
.call{background:#0A0F18;color:#BFE0FF;border:1px solid rgba(201,165,90,.3);border-radius:6px}
.call .hl{color:var(--goldhi)}
/* questions */
.scn{background:linear-gradient(180deg,#1A2334,#121926);border:1px solid #05080D;border-left:4px solid var(--c);border-radius:4px 8px 8px 4px;box-shadow:var(--trim)}
.scn summary{font-family:var(--serif);font-size:1.1rem;color:#EED9A0}
.qtext{font-size:1.18rem;font-weight:500}
.opt{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:rgba(242,216,148,.6);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
.opt .k{border-radius:50%;background:radial-gradient(circle at 35% 30%,#7C98C8,#2B3C5E 60%,#18233A);color:#fff;box-shadow:0 0 0 1px rgba(201,165,90,.55),0 2px 4px rgba(0,0,0,.6);font-family:var(--serif)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,165,90,.12)}
.opt[aria-pressed="true"] .k{background:radial-gradient(circle at 35% 30%,#FFF0C2,#D6AA4E 60%,#8C6A26);color:#221704}
.opt.right{border-color:var(--good);background:rgba(92,201,122,.12)}
.opt.right .k{background:radial-gradient(circle at 35% 30%,#C9F5D5,#4FB86C 60%,#256B3A);color:#06200F}
.opt.wrong{border-color:var(--bad);background:rgba(224,96,90,.12)}
.opt.wrong .k{background:radial-gradient(circle at 35% 30%,#FFD3CF,#D2554E 60%,#7A2420);color:#2A0705}
.opt{position:relative}
.opt.right.mine::after{content:"+100 gold";position:absolute;right:14px;bottom:10px;font-family:var(--mono);font-size:.85rem;color:var(--goldhi);text-shadow:0 0 8px rgba(242,216,148,.5);animation:goldup 1.4s ease-out forwards;pointer-events:none}
@keyframes goldup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.explain{background:linear-gradient(180deg,#1F2A3E,#161F30);border-left:4px solid var(--c);border-radius:4px 8px 8px 4px;box-shadow:var(--trim)}
.explain .vd{font-family:var(--serif);font-weight:400;font-size:1.3rem}
.rulebox{border-top:1px solid var(--line)}
.prail i{border-radius:3px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.prail i.ok{background:linear-gradient(180deg,#9BE8B0,#3E9E5B)}.prail i.no{background:linear-gradient(180deg,#F3A29C,#B4423C)}.prail i.cur{background:linear-gradient(180deg,#FFF0C2,#C99E45)}
/* mock */
.mockbar{background:linear-gradient(180deg,#1E2940,#131B29);border:1px solid #05080D;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(201,165,90,.45),0 10px 24px -10px rgba(0,0,0,.8)}
.timer{font-family:var(--mono);color:var(--goldhi)}
.qmap button{border:1px solid var(--line);border-radius:5px;background:linear-gradient(180deg,#26334C,#18213A);color:var(--ink)}
.qmap button.ans{background:linear-gradient(180deg,#7FB3FF,#2F6BC9);color:#06142C;border-color:#0B2550}
.qmap button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.qmap button.cur{outline:2px solid var(--goldhi);outline-offset:2px}
.score .big{font-family:var(--serif);font-weight:400;letter-spacing:0;background:linear-gradient(180deg,#FFF6DA,#E6C77F 50%,#AD893F);-webkit-background-clip:text;background-clip:text;color:transparent}
.score .big.pass{background:linear-gradient(180deg,#D8FFE3,#5CC97A 60%,#2E7D46);-webkit-background-clip:text;background-clip:text}
.score .big.fail{background:linear-gradient(180deg,#FFE0DC,#E0605A 60%,#8E2B26);-webkit-background-clip:text;background-clip:text}
.verdictbar{font-family:var(--serif);font-weight:400;border-radius:4px 8px 8px 4px;background:rgba(255,255,255,.04)}
/* cells, bars, cards */
.cell{border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.streak i{border-radius:2px;background:rgba(255,255,255,.07)}.streak i.on{background:linear-gradient(180deg,#9BE8B0,#3E9E5B)}
.xpbar,.hp,.deckbar{height:12px;border-radius:6px;background:#0A0F18;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(201,165,90,.3);overflow:hidden}
.xpbar i{border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 65%,#000))}
.hp i{background:linear-gradient(180deg,#F3A29C,#C7463F 55%,#7A2420)}
.hp::after{display:none}
.face{border:1px solid #05080D;border-radius:12px;background:linear-gradient(180deg,#1E2940,#131B29);box-shadow:inset 0 0 0 1px rgba(201,165,90,.4),0 18px 36px -16px rgba(0,0,0,.8)}
.face.fr{border-top:1px solid #05080D;box-shadow:inset 0 3px 0 var(--c),inset 0 0 0 1px rgba(201,165,90,.4),0 18px 36px -16px rgba(0,0,0,.8)}
.face .q{font-family:var(--serif);font-weight:400}
.face.bk{background:radial-gradient(120% 90% at 50% 0%,#24406B,#101A2C 70%);color:var(--ink);border-color:#05080D}
.face.bk code{background:rgba(255,255,255,.1);color:#fff}
/* library + guide */
.rn{font-family:var(--serif);font-weight:400;color:var(--c,var(--goldhi))}
details.rule{border-top:1px solid var(--line)}
th{font-family:var(--serif);font-weight:400;color:#EED9A0;border-bottom:1px solid rgba(201,165,90,.4)}
td{border-bottom:1px solid var(--line)}
.shape,.item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px}
.shape b{font-family:var(--serif);font-weight:400;color:#EED9A0}
.chapnum{font-family:var(--serif);font-weight:400;letter-spacing:0;text-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.callout{border-radius:4px 8px 8px 4px;background:color-mix(in srgb,var(--c) 9%,#141C2A)}
.callout b{font-family:var(--serif);font-weight:400}
.glyphbox{border-radius:50%;background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--c) 40%,#1E2940),#101724)}
.vtag{border-radius:4px}
.trig{border-left:4px solid var(--c)}
.reslink{color:#BFE0FF}
.now{background:var(--gold);color:#221704}
.dg{fill:#1A2334;stroke:#AFC0D8}.da{stroke:#AFC0D8}
/* palette */
#pal{background:rgba(4,6,12,.66)}
.palbox{background:linear-gradient(180deg,#1E2940,#131B29);border:1px solid #05080D;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(201,165,90,.45),0 30px 60px rgba(0,0,0,.7)}
.palbox input{background:transparent;border-bottom:1px solid var(--line)}
.palbox li[aria-selected="true"]{background:linear-gradient(90deg,rgba(201,165,90,.3),rgba(201,165,90,.05));color:var(--goldhi)}
/* entrance */
.main.enter>*{animation:fadeup .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,8)*55ms)}
.main.enter>*:nth-child(1){--n:0}.main.enter>*:nth-child(2){--n:1}.main.enter>*:nth-child(3){--n:2}.main.enter>*:nth-child(4){--n:3}
.main.enter>*:nth-child(5){--n:4}.main.enter>*:nth-child(6){--n:5}.main.enter>*:nth-child(7){--n:6}.main.enter>*:nth-child(8){--n:7}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== Archie ===== */
.spr{width:var(--as,64px);height:var(--as,64px);display:block;flex:none;overflow:visible}
.spr .floaty{animation:floaty 3.2s ease-in-out infinite}
.spr .halo{animation:halo 3.2s ease-in-out infinite;transform-origin:32px 34px}
.spr .thr{animation:thr .35s ease-in-out infinite alternate;transform-origin:32px 57px}
.spr .eye{animation:eyeblink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes floaty{50%{transform:translateY(-3px)}}
@keyframes halo{50%{opacity:.85;transform:scale(1.06)}}
@keyframes thr{to{transform:scaleY(1.35);opacity:.75}}
@keyframes eyeblink{0%,94%,100%{transform:none}96%{transform:scaleY(.12)}}
.archie{display:flex;align-items:center;gap:16px;margin:6px 0}
.archie .spr{--as:72px}
.archie.cheer .spr{animation:cheer 1s ease-out 2}
.archie.dazed .spr{animation:dazed 1.6s ease-in-out infinite}
@keyframes cheer{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes dazed{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.bubble{position:relative;background:linear-gradient(180deg,rgba(30,43,66,.96),rgba(18,26,40,.96));border:1px solid #05080D;border-radius:10px;padding:10px 14px 12px;max-width:52ch;
  box-shadow:inset 0 0 0 1px rgba(111,231,255,.35),0 10px 24px -10px rgba(0,0,0,.8);color:var(--ink)}
.bubble b{display:block;font-family:var(--serif);font-weight:400;color:#9EE9FF;font-size:.95rem;margin-bottom:2px}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:14px;height:14px;margin-top:-7px;background:#18233A;transform:rotate(45deg);box-shadow:-1px 1px 0 rgba(111,231,255,.35)}
.vdrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.vdrow .spr{--as:46px}
@container (max-width:560px){.archie{gap:10px}.archie .spr{--as:54px}}

/* floating fairy guide */
#fairy{position:fixed;right:10px;bottom:14px;z-index:40;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
#fairy .spr{--as:54px}
#fairy .tip{position:absolute;right:66px;bottom:16px;white-space:nowrap;background:linear-gradient(180deg,#1E2B42,#121A28);border-radius:8px;padding:6px 12px;font-size:.88rem;color:#CFF4FF;box-shadow:inset 0 0 0 1px rgba(111,231,255,.35);animation:fadeup .4s both}
#fairy:hover .spr{filter:brightness(1.15)}
#fairy[hidden]{display:none}
@media (max-width:860px){#fairy{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:12px}#fairy .spr{--as:52px}}

/* ===== coach tour ===== */
#cring{position:fixed;z-index:44;pointer-events:none;border-radius:10px;box-shadow:0 0 0 2px var(--goldhi),0 0 22px 4px rgba(242,216,148,.45),0 0 0 9999px rgba(4,6,12,.58);transition:all .35s cubic-bezier(.2,.8,.2,1)}
#cring[hidden]{display:none}
#coach{position:fixed;left:0;right:0;bottom:0;z-index:46;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#coach[hidden]{display:none}
.cbox{pointer-events:auto;width:100%;max-width:860px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;padding:16px 18px 14px;border-radius:12px;
  background:linear-gradient(180deg,rgba(28,40,62,.97),rgba(14,20,32,.98));border:1px solid #05080D;box-shadow:inset 0 0 0 1px rgba(201,165,90,.5),inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px rgba(0,0,0,.75);
  max-height:min(56vh,520px);overflow:auto;animation:fadeup .35s both}
.cbox .cfairy .spr{--as:92px}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:4px}
.cname{font-family:var(--serif);font-size:1.15rem;color:#9EE9FF}
.cchip{font-size:.74rem;font-weight:600;border-radius:4px;padding:1px 8px;border:1px solid}
.cchip.front{color:#9EE9FF;border-color:rgba(111,231,255,.45)}.cchip.back{color:var(--goldhi);border-color:rgba(242,216,148,.45)}
.cstep{font-size:.8rem;color:var(--muted);margin-left:auto}
.cbox h3{font-size:1.25rem;color:#EED9A0;margin:2px 0 6px}
.cbox p{font-size:1rem;line-height:1.55}
.ccode{margin:10px 0 0;background:#070B12;border:1px solid rgba(201,165,90,.25);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:.86rem;line-height:1.5;color:#BFE0FF;overflow-x:auto;white-space:pre}

.cbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.cbtns .sp{flex:1}
.cdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cdots button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.74rem;padding:1px 10px}
.cdots button[aria-current="true"]{border-color:var(--gold);color:var(--goldhi)}
@media (max-width:620px){.cbox{grid-template-columns:minmax(0,1fr);padding:12px 14px}.cbox .cfairy{display:none}.cstep{margin-left:0;width:100%}.ccode{font-size:.78rem}}

/* ===== Orchestrator Campaign ===== */
.mapwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #05080D;box-shadow:inset 0 0 0 1px rgba(201,165,90,.5),0 20px 40px -18px rgba(0,0,0,.85);background:#101710}
.cmap{display:block;width:100%;height:auto}
.cmap .reg{stroke:rgba(242,216,148,.35);stroke-width:2;stroke-dasharray:10 6}
.cmap .rl{font-family:var(--serif);font-size:22px;fill:#F3E2B0;paint-order:stroke;stroke:#05080D;stroke-width:5px;stroke-linejoin:round}
.cmap .rl2{font-family:var(--sans);font-size:14px;fill:#C9D3E3;paint-order:stroke;stroke:#05080D;stroke-width:4px}
.cmap .lbl{font-family:var(--mono);font-size:13px;fill:#E6EAF2;paint-order:stroke;stroke:#05080D;stroke-width:4px;text-anchor:middle}
.cmap .blbl{font-family:var(--serif);font-size:14px;fill:#FFD9D4;paint-order:stroke;stroke:#05080D;stroke-width:4px;text-anchor:middle}

.cmap .bob{animation:floaty 2.4s ease-in-out infinite}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;background:linear-gradient(180deg,#151D2B,#0E1420);border-top:1px solid rgba(201,165,90,.35);font-size:.8rem;color:#C9D3E3}
.mapscroll{overflow-x:auto;overscroll-behavior-x:contain}
@container (max-width:700px){.mapscroll .cmap{min-width:760px}}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.console{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container (min-width:780px){.console{grid-template-columns:190px minmax(0,1fr) 236px}}
.cpanel{background:linear-gradient(180deg,#1B2437,#111824);border:1px solid #05080D;border-radius:8px;box-shadow:var(--trim);padding:12px;min-width:0}
.minimap svg{width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 0 0 1px rgba(201,165,90,.4)}
.minimap .mm-t{font-size:.76rem;color:var(--muted);margin-top:6px}
@container (max-width:779px){.minimap{display:none}}
.selinfo{display:flex;flex-direction:column;gap:8px}
.selhead{display:flex;gap:12px;align-items:center}
.portrait{width:58px;height:58px;flex:none;border-radius:8px;background:radial-gradient(circle at 40% 30%,#2E4266,#0D1422);box-shadow:inset 0 0 0 1px rgba(201,165,90,.5),inset 0 0 14px rgba(0,0,0,.8);display:grid;place-items:center}
.portrait svg{width:44px;height:44px}
.selhead h3{font-size:1.15rem;color:#EED9A0;margin:0}
.selhead .st{font-size:.8rem;font-weight:600}
.selinfo p{font-size:.94rem}
.hbar{height:10px;border-radius:5px;background:#0A0F18;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(180deg,#B5F5C6,#4FB86C 55%,#256B3A)}
.hbar.foe i{background:linear-gradient(180deg,#F3A29C,#C7463F 55%,#7A2420)}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.cmdcard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}
.cmd{position:relative;aspect-ratio:1;border-radius:6px;border:1px solid #05080D;background:linear-gradient(180deg,#34445F,#1C263A 52%,#202B42);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(201,165,90,.3);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:.7rem;line-height:1.15;text-align:center}
.cmd:hover{filter:brightness(1.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px var(--goldhi)}

@container (max-width:779px){.cmdcard{grid-template-columns:repeat(4,minmax(0,1fr))}.cmd{aspect-ratio:auto;min-height:64px}.cmd.empty{display:none}}
.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.quest .qc{width:18px;height:18px;border-radius:4px;border:1px solid var(--gold);display:grid;place-items:center;font-size:.8rem;color:#221704}
.quest.done .qc{background:linear-gradient(180deg,#F8E3A4,#C29639)}

/* ===== landing ===== */
.hero2{position:relative;border-radius:14px;overflow:hidden;border:1px solid #05080D;box-shadow:inset 0 0 0 1px rgba(201,165,90,.45),0 24px 50px -20px rgba(0,0,0,.85);background:#0D1420}
.hero-bg{position:absolute;inset:-4% -6%;opacity:.26;pointer-events:none;animation:pan 60s ease-in-out infinite alternate}

@keyframes pan{from{transform:translate(0,0) scale(1.02)}to{transform:translate(-5%,-3%) scale(1.08)}}

.lede{font-size:1.1rem;line-height:1.6;color:#C9D3E3;max-width:56ch;margin:16px 0 22px}

.facts{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid rgba(201,165,90,.35);background:rgba(8,12,20,.7)}

.facts div{padding:14px 18px;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.facts b{font-family:var(--serif);font-weight:400;font-size:1.7rem;color:var(--goldhi);line-height:1.1}
.facts span{font-size:.88rem;color:var(--muted)}
.landsec{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.sechead h2{font-size:clamp(1.5rem,3.4cqi,2.1rem);color:#EED9A0}

  background:linear-gradient(180deg,#1E2940,#121A28);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(201,165,90,.25),0 12px 26px -14px rgba(0,0,0,.8);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.mode:hover,.mode:focus-visible{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px var(--goldhi),0 0 28px -6px rgba(242,216,148,.35),0 18px 30px -14px rgba(0,0,0,.85)}
.mode .mk{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}

function traceHtml(ds,anim){
  const U=8,W=640,G=304,MAXH=184,gap=16,pad=8;const usable=W-pad*2-gap*4;
  let x=pad,best=-1,bestD=0,out='',stars='';
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let k=0;k<34;k++){const sx=Math.floor(rnd()*W/4)*4,sy=Math.floor(rnd()*(G-90)/4)*4+4,sz=rnd()<.25?4:2;stars+=`<rect x="${sx}" y="${sy}" width="${sz}" height="${sz}" fill="#F4F1FF" opacity="${(.25+rnd()*.5).toFixed(2)}"/>`;}
  const tw=ORDER.map((d,i)=>{
    const w=Math.round(usable*DOM[d].w/100/U)*U;const tx=x;x+=w+gap;
    const r=ds[d].ready;const hb=Math.max(U,Math.round(r*MAXH/U)*U);const top=G-hb;
    if(r>best){best=r;bestD=i;}
    const c=`var(--d${d})`;let g='';
    g+=`<rect x="${tx}" y="${top}" width="${w}" height="${hb}" fill="${c}"/>`;
    g+=`<rect x="${tx+w-U}" y="${top}" width="${U}" height="${hb}" fill="#000" opacity=".35"/>`;
    for(let bx=tx;bx<tx+w;bx+=U*2)g+=`<rect x="${bx}" y="${top-U}" width="${U}" height="${U}" fill="${c}"/>`;
    for(let wy=top+U*2;wy<=G-U*3;wy+=U*3){for(let wx=tx+U;wx<=tx+w-U*3;wx+=U*2){const lit=((wx/U)*3+(wy/U)*5+d)%5!==0;g+=`<rect x="${wx}" y="${wy}" width="${U}" height="${U}" fill="${lit?'#FFE600':'#05040C'}"/>`;}}
    const pctv=Math.round(r*100);
    return {tx,w,top,d,i,html:`<g class="tw" data-act="quick" data-d="${d}" role="button" tabindex="0" aria-label="Domain ${d}, ${DOM[d].n}: ${pctv} percent ready. Drill it.">
      <rect class="lot lotr" x="${tx}" y="${G-MAXH}" width="${w}" height="${MAXH}"/>
      <g class="tb" style="--i:${i}">${g}</g>
      <rect x="${tx}" y="${G-MAXH-40}" width="${w}" height="${MAXH+96}" fill="transparent"/>
      <text class="pcl" x="${tx+w/2}" y="${top-U*2-6}" text-anchor="middle">${pctv}%</text>
      <text class="dl2" x="${tx}" y="${G+30}" fill="${c}">D${d}</text>
      <text class="nm2" x="${tx}" y="${G+52}">${SKN[d]}</text><text class="nm2 wt" x="${tx}" y="${G+72}">${DOM[d].w}% of exam</text></g>`};});
  out=tw.map(t=>t.html).join('');
  let ground='';for(let gx=0;gx<W;gx+=U*2)ground+=`<rect x="${gx}" y="${G}" width="${U*2-2}" height="${U-2}" fill="#2B2BFF"/>`;
  const bt=tw[bestD];const bs=4;const bx0=Math.round((bt.tx+bt.w/2-20)/4)*4,by0=Math.max(0,bt.top-U*2-6-22-56);
  const bot=archRects('cheer',bx0,by0,bs);
  return `<div class="trace ${anim?'intro':''}"><svg class="skl" viewBox="0 0 ${W} ${G+80}" role="group" aria-label="Readiness skyline: one tower per domain, width is exam weight, height is readiness">${stars}${out}${ground}<g class="bot">${bot}</g></svg></div>`;
}

    body=`<div class="quote">${fmt(it.x.s)}</div><div class="fieldlbl" style="margin:0">Which mechanism fits?</div><ul class="opts">${it.opts.map((v,pos)=>{
      let cls='opt',st='';if(done){if(v===0){cls+=' right';st=it.sel===0?'Correct, and your pick':'The right mechanism';}else if(it.sel===v){cls+=' wrong';st='Your pick';}}

  }
  return `<div class="split"><span class="small muted">Round ${dr.i+1} of ${dr.items.length}</span><button class="btn ghost" data-act="drillend">End</button></div>${prail}
   <section class="panel stack" style="gap:16px">${body}${done?`<div class="row"><button class="btn primary" data-act="dnext">${dr.i+1<dr.items.length?'Next':'See result'}</button><span class="small muted"><span class="kbd">Enter</span> next</span></div>`:''}</section>`;

function dpick(v){

function fmtTime(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function paceInfo(){
  const elapsedMin=(Date.now()-mock.start)/60000;const expect=Math.floor(elapsedMin/2);
  const done=mock.items.filter(x=>x.sel.length).length;const diff=done-expect;
  if(elapsedMin<4)return {t:'On pace',c:'ok'};
  if(diff>=-2)return {t:diff>=3?`${diff} items ahead`:'On pace',c:'ok'};
  return {t:`${-diff} items behind pace`,c:'late'};
}

function finishMock(){
  if(!mock||mock.done)return;

    dom[q.d].n++;if(good)dom[q.d].c++;sc[q.sc].n++;if(good)sc[q.sc].c++;if(!good)tsMiss[q.ts]=(tsMiss[q.ts]||0)+1;record(q.id,good);});
  const p=ok/mock.items.length;
  const mins=Math.max(1,Math.round((Math.min(Date.now(),mock.end)-mock.start)/60000));
  mock.res={ok,n:mock.items.length,pct:Math.round(p*100),scaled:Math.round(100+900*p),dom,sc,mins,tsMiss};

}

/* ---------- actions ---------- */
function startSession(items){sess={items:items.map(q=>mkItem(q)),i:0};view='practice';sub.practice='q';store.view='practice';render();window.scrollTo(0,0);}
function openSetup(){sess=null;mock=null;view='practice';sub.practice='q';store.view='practice';render();window.scrollTo(0,0);}
function act(a,d){
  if(extAct(a,d))return;
  if(a==='quick'){cfg={d:+d.d||0,sc:0,ts:'',mode:'smart',n:10};dr=null;startSession(buildQueue(pool(),10));}
  else if(a==='cfg'){cfg[d.k]=(d.k==='n'||d.k==='d')?+d.v:d.v;render();}
  else if(a==='start'){const q=buildQueue(pool(),cfg.n);if(q.length)startSession(q);}
  else if(a==='pick'){pick(+d.oi);}
  else if(a==='check'){commit();}
  else if(a==='next'){sess.i++;render();window.scrollTo(0,0);}
  else if(a==='flag'){if(!sess)return;const q=byId[sess.items[sess.i].id];if(store.flags[q.id])delete store.flags[q.id];else store.flags[q.id]=1;save();render();}
  else if(a==='endsess'){sess=null;render();}
  else if(a==='again'){const p=buildQueue(pool(),cfg.n);if(p.length)startSession(p);else{sess=null;render();}}
  else if(a==='ptab'){sub.practice=d.v;dr=null;render();}
  else if(a==='ltab'){sub.library=d.v;render();}
  else if(a==='tcat'){sub.tcat=d.v;render();}
  else if(a==='gtab'){sub.guide=d.v;render();}
  else if(a==='glevel'){sub.glevel=+d.v;render();window.scrollTo(0,0);}
  else if(a==='icat'){sub.icat=d.v;render();}
  else if(a==='pal'){palOpen();}
  else if(a==='opendrill'){view='practice';sub.practice=d.v;store.view='practice';startDrill(d.v);window.scrollTo(0,0);}
  else if(a==='drillstart'){startDrill(sub.practice);}
  else if(a==='drillend'){dr=null;render();}
  else if(a==='dpick'){dpick(+d.v);}
  else if(a==='dnext'){dr.i++;render();}
  else if(a==='mockstart'){mockStart();}
  else if(a==='mprev'){mock.i=Math.max(0,mock.i-1);saveMock();render();window.scrollTo(0,0);}
  else if(a==='mnext'){mock.i=Math.min(mock.items.length-1,mock.i+1);saveMock();render();window.scrollTo(0,0);}
  else if(a==='mjump'){mock.i=+d.i;saveMock();render();window.scrollTo(0,0);}
  else if(a==='mflag'){const id=mock.items[mock.i].id;mock.flags[id]=!mock.flags[id];saveMock();render();}
  else if(a==='mconfirm'){mock.confirm=true;render();}
  else if(a==='mcancel'){mock.confirm=false;render();}
  else if(a==='mfinish'){finishMock();}
  else if(a==='mockreset'){mock=null;render();}
  else if(a==='missed'){cfg={d:0,sc:0,ts:'',mode:'missed',n:20};dr=null;const p=buildQueue(pool(),20);if(p.length){mock=null;startSession(p);}else{openSetup();}}
  else if(a==='deck'){cardCfg.d=+d.v;cardQ=null;flipped=false;render();}
  else if(a==='flip'){flipped=!flipped;render();}
  else if(a==='cardyes'){rateCard(true);}
  else if(a==='cardno'){rateCard(false);}
  else if(a==='rate'){store.rate[d.id]=+d.v;save();render();}
  else if(a==='tsdrill'){cfg={d:0,sc:0,ts:d.v,mode:'smart',n:0};dr=null;const p=buildQueue(pool(),0);if(p.length){if(mock&&mock.done)mock=null;startSession(p);}else openSetup();}
  else if(a==='scdrill'){cfg={d:0,sc:+d.v,ts:'',mode:'smart',n:10};dr=null;const p=buildQueue(pool(),10);if(p.length)startSession(p);else openSetup();}
  else if(a==='planstart'){store.planStart=today();save();render();}
  else if(a==='resetask'){resetAsk=true;render();}
  else if(a==='resetno'){resetAsk=false;render();}
  else if(a==='resetyes'){store={answers:{},cards:{},rate:{},flags:{},mocks:[],days:[],examDate:'',view:'library',drill:{tell:{n:0,c:0},shape:{n:0,c:0},axis:{n:0,c:0}},plan:{},planStart:'',guide:{done:{}}};resetAsk=false;cardQ=null;save();clearMock();render();}
}
function pick(oi){
  if(view==='practice'&&sess){
    const it=sess.items[sess.i];if(!it||it.done)return;const q=byId[it.id];
    if(q.a.length===1){it.sel=[oi];commit();return;}
    const k=it.sel.indexOf(oi);if(k>=0)it.sel.splice(k,1);else if(it.sel.length<q.a.length)it.sel.push(oi);
    render();
  }else if(view==='mock'&&mock&&!mock.done){
    const it=mock.items[mock.i],q=byId[it.id];
    if(q.a.length===1)it.sel=[oi];
    else{const k=it.sel.indexOf(oi);if(k>=0)it.sel.splice(k,1);else if(it.sel.length<q.a.length)it.sel.push(oi);}
    saveMock();render();
  }
}
function commit(){
  const it=sess.items[sess.i],q=byId[it.id];
  if(it.done||it.sel.length!==q.a.length)return;
  it.done=true;it.ok=sameSet(it.sel,q.a);record(q.id,it.ok);save();render();
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='examDate'){store.examDate=t.value;save();render();}
  else if(t.id==='cfgSc'){cfg.sc=+t.value;render();}
  else if(t.id==='cfgTs'){cfg.ts=t.value;render();}
  else if(t.dataset&&t.dataset.gdone){if(t.checked)store.guide.done[t.dataset.gdone]=1;else delete store.guide.done[t.dataset.gdone];touchDay();save();render();}
  else if(t.dataset&&t.dataset.plan){if(t.checked)store.plan[t.dataset.plan]=1;else delete store.plan[t.dataset.plan];touchDay();save();render();}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return;}
  if(!$('#pal').hidden)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(view==='practice'&&sub.practice==='q'&&sess&&sess.i<sess.items.length){
    const it=sess.items[sess.i],q=byId[it.id];
    if(!it.done&&/^[1-8]$/.test(k)){const pos=+k-1;if(pos<it.perm.length){pick(it.perm[pos]);e.preventDefault();}}
    else if(it.done&&(k==='Enter'||k==='n')){act('next',{});e.preventDefault();}
    else if(!it.done&&k==='Enter'&&q.a.length>1){commit();}
    else if(k==='f'){act('flag',{});}
  }else if(view==='practice'&&sub.practice!=='q'&&dr&&dr.i<dr.items.length){
    const it=dr.items[dr.i];
    if(it.sel===null&&/^[1-9]$/.test(k)){const pos=+k-1;if(pos<it.opts.length){dpick(it.opts[pos]);e.preventDefault();}}
    else if(it.sel!==null&&k==='Enter'){act('dnext',{});e.preventDefault();}
  }else if(view==='mock'&&mock&&!mock.done){
    const it=mock.items[mock.i];
    if(/^[1-8]$/.test(k)){const pos=+k-1;if(pos<it.perm.length){pick(it.perm[pos]);e.preventDefault();}}
    else if(k==='ArrowRight'){act('mnext',{});}
    else if(k==='ArrowLeft'){act('mprev',{});}
    else if(k==='f'){act('mflag',{});}
  }else if(view==='cards'&&cardQ&&cardQ.length){
    if(k===' '){flipped=!flipped;render();e.preventDefault();}
    else if(flipped&&k==='ArrowRight'){rateCard(true);}
    else if(flipped&&k==='ArrowLeft'){rateCard(false);}
  }
});

/* ---------- count up and command palette ---------- */
function countUp(){
  const el=$('#bn');if(!el)return;const v=+el.dataset.v;
  if(!v||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const t0=performance.now();el.textContent='0';
  (function f(t){const k=Math.min(1,(t-t0)/1000);el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);
}
const palEl=document.createElement('div');palEl.id='pal';palEl.hidden=true;
palEl.innerHTML='<div class="palbox" role="dialog" aria-label="Jump to"><input aria-label="Jump to" placeholder="Jump to a page, a level, or a task drill" autocomplete="off"><ul role="listbox"></ul></div>';
document.body.appendChild(palEl);
let palI=0,palList=[];
function openGuide(tab,lvl){view='guide';sub.guide=tab;if(lvl)sub.glevel=lvl;store.view='guide';save();render();window.scrollTo(0,0);}
function palAll(){
  const it=[];const add=(t,run)=>it.push({t,run,k:t.toLowerCase()});
  add('Home',()=>go('home'));add('Exam map',()=>go('map'));
  [1,2,3,4,5].forEach(n=>add('Guidebook: Level '+n+' '+DOM[n].n,()=>openGuide('walk',n)));
  add('Map: exam scenarios',()=>{csel='boss:1';go('map');});add('Map: common wrong answers',()=>{csel='creep:0';go('map');});add('Ask Archie: guided tour',()=>coachOpen(0));add('Archie: turn hints on or off',()=>{hintsOn=!hintsOn;store.hints=hintsOn;save();if(hintsOn)showHint(true);else hideHint();});add('Guidebook: Items',()=>openGuide('items'));add('Guidebook: Maps',()=>openGuide('maps'));
  add('Practice: Questions',()=>{sess=null;dr=null;sub.practice='q';go('practice');});
  add('Practice: Spot the tell',()=>act('opendrill',{v:'tell'}));
  add('Practice: Name the shape',()=>act('opendrill',{v:'shape'}));
  add('Practice: Pick the axis',()=>act('opendrill',{v:'axis'}));
  add('Guidebook: Trigger words',()=>openGuide('trig'));
  add('Mock exam',()=>go('mock'));add('Flashcards',()=>go('cards'));
  add('Library: Playbook',()=>{sub.library='playbook';go('library');});add('Library: Study plan',()=>{sub.library='plan';go('library');});add('Library: Syllabus',()=>{sub.library='syllabus';go('library');});
  [1,2,3,4,5].forEach(d=>add('Drill Domain '+d+': '+DOM[d].n,()=>act('quick',{d:d})));
  TS.forEach(t=>add('Drill '+t.id+' '+t.t,()=>act('tsdrill',{v:t.id})));
  return it;
}
function palDraw(){
  const q=$('#pal input').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  palList=palAll().filter(i=>q.every(w=>i.k.includes(w))).slice(0,40);
  if(palI>=palList.length)palI=0;
  $('#pal ul').innerHTML=palList.length?palList.map((i,n)=>`<li role="option" data-n="${n}" aria-selected="${n===palI}">${esc(i.t)}</li>`).join(''):'<li>No matches</li>';
  const sel=$('#pal li[aria-selected="true"]');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function palOpen(){palEl.hidden=false;palI=0;const i=$('#pal input');i.value='';palDraw();i.focus();}
function palClose(){palEl.hidden=true;}
function palGo(n){const it=palList[n];if(!it)return;palClose();it.run();}
palEl.addEventListener('click',e=>{const li=e.target.closest('li[data-n]');if(li){palGo(+li.dataset.n);return;}if(e.target===palEl)palClose();});
palEl.addEventListener('input',()=>{palI=0;palDraw();});
palEl.addEventListener('keydown',e=>{
  if(e.key==='Escape'){palClose();}
  else if(e.key==='ArrowDown'){palI=Math.min(palList.length-1,palI+1);palDraw();e.preventDefault();}
  else if(e.key==='ArrowUp'){palI=Math.max(0,palI-1);palDraw();e.preventDefault();}
  else if(e.key==='Enter'){palGo(palI);e.preventDefault();}
});


/*__APP__*/
/*__EXPERIENCE__*/
loadMock();
experienceBoot();
if(view==='mock'&&mock&&!mock.done&&mock.end<Date.now())finishMock();
else render();
window.__ccarf={Q,CARDS,store:()=>store,go,hint:()=>showHint(true),hints:v=>{hintsOn=v;if(!v)hideHint();}};
})();
